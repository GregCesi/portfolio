<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXE-75 · Variante 1 · CSS seul</title>
<link rel="icon" href="data:,">
<style>
/* Jetons de couleur du site (app/assets/css/main.css). */
:root {
  --color-bg: #05070a;
  --color-ink: #e6ecef;
  --color-ink-dim: #8c98a3;
  --color-accent: #a9cbdd;
  --color-surface: #0c131b;
  --font-display: 'Jost', 'Futura', system-ui;
  --font-sans: 'Hanken Grotesk', 'Helvetica Neue', system-ui;

  /* Métal sombre bleuté, dérivé des jetons. */
  --steel: color-mix(in srgb, var(--color-surface) 70%, var(--color-accent) 16%);
  --steel-hi: color-mix(in srgb, var(--steel) 70%, var(--color-ink) 30%);
  --steel-lo: color-mix(in srgb, var(--steel) 45%, black);
  /* Rivet : un reflet ponctuel décalé en haut à gauche sur une tête bombée
     dont le bas à droite plonge dans l'ombre. Rayon fixe, indépendant de la tuile. */
  --rivet:
    radial-gradient(circle 3px at 6px 6px, color-mix(in srgb, var(--color-ink) 80%, transparent), transparent),
    radial-gradient(circle 8px at 9px 9px,
      color-mix(in srgb, var(--steel-hi) 90%, var(--color-accent)) 0,
      var(--steel) 45%,
      var(--steel-lo) 80%,
      color-mix(in srgb, black 70%, transparent) 92%,
      transparent 100%);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-bg); }

/* Derrière la porte : le fond du site, un halo d'accent au centre. */
.behind {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 40% 60% at 50% 50%, color-mix(in srgb, var(--color-accent) 18%, transparent), transparent 70%), var(--color-bg);
}

.leaf {
  position: fixed; top: 0; bottom: 0; width: 50%;
  overflow: hidden;
  will-change: transform;
  background-color: var(--steel);
  background-image:
    /* reflet anisotrope : une bande claire oblique, comme sur un métal brossé */
    linear-gradient(97deg, transparent 18%, color-mix(in srgb, var(--color-accent) 10%, transparent) 38%, color-mix(in srgb, var(--color-ink) 7%, transparent) 44%, transparent 62%),
    /* éclairage vertical : haut plus clair, bas plus sombre */
    linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 8%, transparent), transparent 40%, color-mix(in srgb, black 35%, transparent)),
    /* brossage : trois trames de périodes premières entre elles, pour casser la répétition */
    repeating-linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 5%, transparent) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(to bottom, color-mix(in srgb, black 22%, transparent) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(to bottom, transparent 0 5px, color-mix(in srgb, var(--color-ink) 4%, transparent) 5px 6px, transparent 6px 13px);
}
.leaf--left { left: 0; box-shadow: inset -1px 0 0 color-mix(in srgb, black 60%, transparent); }
.leaf--right { right: 0; box-shadow: inset 1px 0 0 color-mix(in srgb, black 60%, transparent); }

/* Rivets le long des bords haut, bas et extérieur de chaque battant. */
.leaf::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: var(--rivet), var(--rivet), var(--rivet);
  background-size: 46px 18px, 46px 18px, 46px 18px, 46px 18px, 18px 46px, 18px 46px;
  background-repeat: repeat-x, repeat-x, repeat-x, repeat-x, repeat-y, repeat-y;
}
.leaf--left::before {
  background-position: 16px 10px, 16px 10px, 16px calc(100% - 10px), 16px calc(100% - 10px), 10px 16px, 10px 16px;
}
.leaf--right::before {
  background-position: 16px 10px, 16px 10px, 16px calc(100% - 10px), 16px calc(100% - 10px), calc(100% - 10px) 16px, calc(100% - 10px) 16px;
}

/* Deux panneaux en semi-relief par battant : chanfrein clair en haut à
   gauche, sombre en bas à droite, ombre portée vers le bas à droite. */
.plate {
  position: absolute; left: 10%; right: 12%;
  border: 7px solid;
  border-color: color-mix(in srgb, var(--steel-hi) 85%, var(--color-accent)) var(--steel-lo) color-mix(in srgb, black 55%, var(--steel-lo)) color-mix(in srgb, var(--steel-hi) 70%, var(--steel));
  border-radius: 3px;
  background-color: color-mix(in srgb, var(--steel) 92%, var(--color-ink));
  background-image:
    linear-gradient(100deg, transparent 25%, color-mix(in srgb, var(--color-ink) 9%, transparent) 42%, transparent 58%),
    linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 6%, transparent), color-mix(in srgb, black 25%, transparent)),
    repeating-linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 6%, transparent) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(to bottom, color-mix(in srgb, black 20%, transparent) 0 1px, transparent 1px 9px);
  box-shadow:
    inset 1px 1px 0 color-mix(in srgb, var(--color-ink) 30%, transparent),
    inset -1px -1px 0 color-mix(in srgb, black 70%, transparent),
    -1px -1px 0 color-mix(in srgb, var(--color-ink) 14%, transparent),
    6px 9px 16px color-mix(in srgb, black 65%, transparent),
    2px 3px 3px color-mix(in srgb, black 55%, transparent);
}
.plate--upper { top: 9%; height: 30%; }
.plate--lower { bottom: 11%; height: 30%; }
.leaf--right .plate { left: 12%; right: 10%; }

/* Cadre de la fente : chaque battant porte une lèvre épaisse sur son bord
   intérieur ; les deux lèvres jointes forment le cadre. */
.lip {
  position: absolute; top: 0; bottom: 0; width: 30px;
  background-image:
    linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 8%, transparent), transparent 40%, color-mix(in srgb, black 40%, transparent)),
    repeating-linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 5%, transparent) 0 1px, transparent 1px 3px);
  background-color: var(--steel-lo);
}
.leaf--left .lip {
  right: 0;
  box-shadow: inset 2px 0 0 color-mix(in srgb, var(--color-ink) 22%, transparent), inset -3px 0 0 color-mix(in srgb, black 70%, transparent), -8px 0 14px color-mix(in srgb, black 55%, transparent);
}
.leaf--right .lip {
  left: 0;
  box-shadow: inset 2px 0 0 color-mix(in srgb, var(--color-ink) 18%, transparent), inset -2px 0 0 color-mix(in srgb, black 60%, transparent), 8px 0 14px color-mix(in srgb, black 55%, transparent);
}
.lip::after {
  content: ''; position: absolute; inset: 0;
  background-image: var(--rivet); background-size: 18px 64px; background-repeat: repeat-y; background-position: 6px 20px, 6px 20px;
}

/* Le nom : lettres gravées en creux dans le métal, entre les deux panneaux. */
.word {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  margin: 0; padding-left: 0.34em; white-space: nowrap;
  font-family: var(--font-display); font-weight: 400; font-size: 30px;
  text-transform: uppercase; letter-spacing: 0.34em;
  color: transparent;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--color-ink) 70%, var(--steel)), var(--color-accent) 55%, color-mix(in srgb, var(--steel-hi) 80%, var(--color-ink)));
  -webkit-background-clip: text; background-clip: text;
  text-shadow: 0 -1px 0 color-mix(in srgb, black 80%, transparent), 0 1px 0 color-mix(in srgb, var(--color-ink) 18%, transparent);
  filter: drop-shadow(0 1px 0 color-mix(in srgb, black 60%, transparent));
}

.slit {
  position: fixed; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px;
  background: linear-gradient(to bottom, transparent, var(--color-accent) 15%, var(--color-accent) 85%, transparent);
  box-shadow: 0 0 calc(6px + 26px * var(--glow, 0)) color-mix(in srgb, var(--color-accent) calc(40% + 60% * var(--glow, 0)), transparent);
  transform: scaleX(calc(1 + 2 * var(--glow, 0)));
  pointer-events: none;
}

.ui { position: fixed; top: 16px; z-index: 10; font-family: var(--font-sans); font-size: 14px; }
.ui--left { left: 16px; } .ui--right { right: 16px; }
.ui a, .ui button {
  color: var(--color-ink); background: color-mix(in srgb, var(--color-bg) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--color-ink) 25%, transparent); border-radius: 4px;
  padding: 6px 12px; font: inherit; text-decoration: none; cursor: pointer;
}
</style>
</head>
<body>
<div class="behind"></div>
<div class="leaf leaf--left" data-leaf="left">
  <div class="plate plate--upper"></div>
  <div class="plate plate--lower"></div>
  <p class="word" data-word="left">Grégoire</p>
  <div class="lip"></div>
</div>
<div class="leaf leaf--right" data-leaf="right">
  <div class="plate plate--upper"></div>
  <div class="plate plate--lower"></div>
  <p class="word" data-word="right">Marchand</p>
  <div class="lip"></div>
</div>
<div class="slit"></div>
<div class="ui ui--left"><a href="./index.html">← Comparaison</a></div>
<div class="ui ui--right"><button type="button" id="replay">Rejouer</button></div>

<script type="module">
// Séquence commune aux 4 variantes : porte fermée, la fente s'intensifie,
// puis les battants coulissent. `window.door` expose de quoi mesurer.
const HOLD_MS = 900
const GLOW_MS = 600
const OPEN_MS = 1600
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)

const leaves = { left: document.querySelector('[data-leaf="left"]'), right: document.querySelector('[data-leaf="right"]') }
const words = { left: document.querySelector('[data-word="left"]'), right: document.querySelector('[data-word="right"]') }
const slit = document.querySelector('.slit')
let raf = 0
let progress = 0

function render(glow, p) {
  progress = p
  const e = ease(p)
  leaves.left.style.transform = `translateX(${-e * 104}%)`
  leaves.right.style.transform = `translateX(${e * 104}%)`
  slit.style.setProperty('--glow', String(glow))
  slit.style.opacity = String(1 - Math.min(1, p * 2))
}

function play() {
  cancelAnimationFrame(raf)
  const start = performance.now()
  const tick = (now) => {
    const t = now - start
    const glow = Math.min(1, Math.max(0, (t - HOLD_MS) / GLOW_MS))
    const p = Math.min(1, Math.max(0, (t - HOLD_MS - GLOW_MS) / OPEN_MS))
    render(glow, p)
    if (p < 1) raf = requestAnimationFrame(tick)
  }
  render(0, 0)
  raf = requestAnimationFrame(tick)
}

const rect = (el) => { const r = el.getBoundingClientRect(); return { left: r.left, right: r.right, top: r.top, bottom: r.bottom } }
window.door = {
  replay: play,
  seek(p) { cancelAnimationFrame(raf); render(p > 0 ? 1 : 0, p) },
  get progress() { return progress },
  measure() {
    return {
      viewport: { width: innerWidth, height: innerHeight },
      progress,
      left: { leaf: rect(leaves.left), extent: rect(leaves.left), word: rect(words.left) },
      right: { leaf: rect(leaves.right), extent: rect(leaves.right), word: rect(words.right) },
    }
  },
}
document.getElementById('replay').addEventListener('click', play)
document.fonts.ready.then(play)
</script>
</body>
</html>
