<title>EXE-75 · Variante 3 · Three.js sans skill iart-ai</title>

<style>
:root {
  --color-bg: #05070a;
  --color-ink: #e6ecef;
  --font-sans: 'Hanken Grotesk', 'Helvetica Neue', system-ui;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-bg); }
canvas { display: block; }
.ui { position: fixed; top: 16px; z-index: 10; font-family: var(--font-sans); font-size: 14px; }
.ui--left { left: 16px; } .ui--right { right: 16px; }
.ui a, .ui button {
  color: var(--color-ink); background: color-mix(in srgb, var(--color-bg) 70%, transparent);
  border: 1px solid color-mix(in srgb, var(--color-ink) 25%, transparent); border-radius: 4px;
  padding: 6px 12px; font: inherit; text-decoration: none; cursor: pointer;
}
</style>
<!-- Three.js est servi depuis node_modules du dépôt : aucune ressource réseau. -->
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div class="ui ui--left"><a href="./index.html">← Comparaison</a></div>
<div class="ui ui--right"><button type="button" id="replay">Rejouer</button></div>

<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'

// Jetons de couleur du site (app/assets/css/main.css).
const COLOR = { bg: 0x05070a, ink: 0xe6ecef, accent: 0xa9cbdd, surface: 0x0c131b }
const FONT = "400 {size}px Jost, Futura, system-ui"

const FOV = 30
const BLEED = 60 // les battants débordent de l'écran pour que leur tranche reste cachée
const GAP = 0 // les battants se touchent ; la fente est une lumière posée devant
const LIP_W = 30
const WORD_PX = 30

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.05
document.body.prepend(renderer.domElement)

const scene = new THREE.Scene()
scene.background = new THREE.Color(COLOR.bg)
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 10000)

// Environnement studio pré-filtré : c'est lui que reflète le métal.
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.55

const key = new THREE.DirectionalLight(0xffffff, 2.2)
key.position.set(-1, 1.1, 1.3)
scene.add(key)
const rim = new THREE.DirectionalLight(COLOR.accent, 0.6)
rim.position.set(1, -0.6, 0.8)
scene.add(rim)
// Lumière de la fente : s'allume pendant l'intensification.
const slitLight = new THREE.PointLight(COLOR.accent, 0, 0, 1.2)
scene.add(slitLight)

// --- Textures procédurales du brossage -----------------------------------
// Des traits horizontaux de longueur, d'épaisseur et d'opacité aléatoires :
// servent de carte de rugosité et de carte de relief (bump).
function brushedCanvas(size = 1024) {
  const c = document.createElement('canvas')
  c.width = c.height = size
  const g = c.getContext('2d')
  g.fillStyle = '#808080'
  g.fillRect(0, 0, size, size)
  for (let i = 0; i < 9000; i++) {
    const y = Math.random() * size
    const x = Math.random() * size
    const len = 80 + Math.random() * 600
    const v = Math.floor(90 + Math.random() * 80)
    g.strokeStyle = `rgba(${v},${v},${v},${0.15 + Math.random() * 0.35})`
    g.lineWidth = 0.5 + Math.random() * 1.2
    g.beginPath()
    g.moveTo(x, y)
    g.lineTo(x + len, y + (Math.random() - 0.5) * 0.6)
    g.stroke()
    if (x + len > size) { g.beginPath(); g.moveTo(x - size, y); g.lineTo(x + len - size, y); g.stroke() }
  }
  return c
}
const brushed = brushedCanvas()
function brushedTexture(repeatX, repeatY) {
  const t = new THREE.CanvasTexture(brushed)
  t.wrapS = t.wrapT = THREE.RepeatWrapping
  t.repeat.set(repeatX, repeatY)
  t.anisotropy = renderer.capabilities.getMaxAnisotropy()
  return t
}

function steel(color, roughness, repeatX, repeatY) {
  const map = brushedTexture(repeatX, repeatY)
  return new THREE.MeshPhysicalMaterial({
    color, metalness: 1, roughness,
    roughnessMap: map, bumpMap: map, bumpScale: 0.6,
    clearcoat: 0.15, clearcoatRoughness: 0.5,
  })
}

// --- Géométries ------------------------------------------------------------
function roundedRect(w, h, r) {
  const s = new THREE.Shape()
  s.moveTo(-w / 2 + r, -h / 2)
  s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r)
  s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2)
  s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r)
  s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2)
  return s
}
// Panneau en semi-relief : forme extrudée, chanfrein arrondi.
function plateGeometry(w, h) {
  const g = new THREE.ExtrudeGeometry(roundedRect(w - 16, h - 16, 4), {
    depth: 4, bevelEnabled: true, bevelThickness: 7, bevelSize: 8, bevelSegments: 5, curveSegments: 6,
  })
  return g
}

// Mot : texte dessiné sur un canvas, plaqué sur un plan. Le canvas est
// rogné au plus près des glyphes pour que le plan mesure le mot.
function wordMesh(text) {
  const scale = 4
  const size = WORD_PX * scale
  const c = document.createElement('canvas')
  const g = c.getContext('2d')
  g.font = FONT.replace('{size}', size)
  g.letterSpacing = `${0.34 * size}px`
  const m = g.measureText(text.toUpperCase())
  const glyphW = m.width - 0.34 * size // l'interlettrage final n'appartient pas au mot
  const pad = 6 * scale
  c.width = Math.ceil(glyphW + pad * 2)
  c.height = Math.ceil(size * 1.3 + pad * 2)
  g.font = FONT.replace('{size}', size)
  g.letterSpacing = `${0.34 * size}px`
  g.textBaseline = 'middle'
  g.fillStyle = '#fff'
  g.fillText(text.toUpperCase(), pad, c.height / 2)
  const tex = new THREE.CanvasTexture(c)
  tex.anisotropy = 8
  const w = c.width / scale
  const h = c.height / scale
  const group = new THREE.Group()
  // Lettres de métal poli posées sur la tôle…
  const face = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshPhysicalMaterial({ color: 0xc9d9e3, metalness: 1, roughness: 0.35, alphaMap: tex, transparent: true }),
  )
  face.position.z = 1
  // … avec une ombre portée en bas à droite, qui les décolle.
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: 0x000000, alphaMap: tex, transparent: true, opacity: 0.7 }),
  )
  shadow.position.set(1.5, -2, 0.5)
  // Ordre fixe : l'ombre d'abord, les lettres ensuite, sans écriture de profondeur.
  shadow.renderOrder = 1
  face.renderOrder = 2
  shadow.material.depthWrite = face.material.depthWrite = false
  group.add(shadow, face)
  // Rectangle des glyphes seuls, en coordonnées locales, pour la mesure.
  group.userData.glyphs = { w: glyphW / scale, h: size / scale }
  return group
}

// --- Construction des battants -------------------------------------------
const leaves = { left: new THREE.Group(), right: new THREE.Group() }
scene.add(leaves.left, leaves.right)
let W = 0
let H = 0

function disposeGroup(g) {
  g.traverse((o) => {
    o.geometry?.dispose()
    const mats = Array.isArray(o.material) ? o.material : [o.material]
    mats.forEach((m) => { if (!m) return; for (const k of ['map', 'alphaMap', 'roughnessMap', 'bumpMap']) m[k]?.dispose(); m.dispose() })
  })
  g.clear()
}

function buildLeaf(group, side, text) {
  disposeGroup(group)
  const s = side === 'left' ? -1 : 1 // côté extérieur
  const leafW = W / 2 + BLEED - GAP
  const leafH = H + BLEED * 2
  const inner = s * GAP // bord intérieur, contre la fente
  const cx = inner + s * leafW / 2

  // Tôle du battant : face avant à z = 0.
  const slab = new THREE.Mesh(new THREE.BoxGeometry(leafW, leafH, 40), steel(0x5d6f7e, 0.42, leafW / 700, leafH / 700))
  slab.position.set(cx, 0, -20)
  group.add(slab)

  // Deux panneaux en semi-relief.
  const pw = (W / 2) * 0.78
  const ph = H * 0.3
  const pcx = s * (GAP + (W / 2) * 0.12 + pw / 2)
  const plateMat = steel(0x71849a, 0.32, 1 / 500, 1 / 500)
  for (const py of [H * 0.26, -H * 0.26]) {
    const p = new THREE.Mesh(plateGeometry(pw, ph), plateMat)
    p.position.set(pcx, py, 0)
    group.add(p)
  }

  // Lèvre épaisse le long de la fente : les deux lèvres forment le cadre.
  const lip = new THREE.Mesh(plateGeometry(LIP_W + 12, leafH + 40), steel(0x3d4a56, 0.38, 1 / 400, 1 / 400))
  lip.position.set(inner + s * (LIP_W + 12) / 2, 0, 0)
  group.add(lip)

  // Rivets : demi-sphères aplaties le long des bords.
  const rivetGeo = new THREE.SphereGeometry(6, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2)
  rivetGeo.rotateX(Math.PI / 2)
  rivetGeo.scale(1, 1, 0.55)
  const positions = []
  const top = H / 2 - 14
  const outer = s * (W / 2 - 14)
  for (let x = GAP + LIP_W + 20; x < W / 2 - 20; x += 46) { positions.push([s * x, top], [s * x, -top]) }
  for (let y = -top + 32; y < top - 16; y += 46) positions.push([outer, y])
  for (let y = -H / 2 + 24; y < H / 2; y += 64) positions.push([inner + s * (LIP_W / 2 + 2), y])
  const rivets = new THREE.InstancedMesh(rivetGeo, new THREE.MeshPhysicalMaterial({ color: 0x8a9cab, metalness: 1, roughness: 0.25 }), positions.length)
  const m = new THREE.Matrix4()
  positions.forEach(([x, y], i) => {
    const z = Math.abs(x - (inner + s * (LIP_W / 2 + 2))) < 1 ? 11 : 0
    rivets.setMatrixAt(i, m.makeTranslation(x, y, z))
  })
  group.add(rivets)

  // Le mot, centré sur la moitié d'écran du battant.
  const word = wordMesh(text)
  word.position.set(s * (W / 4), 0, 0)
  word.name = 'word'
  group.add(word)
}

// La fente : un filet d'accent entre les deux lèvres, et un halo additif
// qui grandit pendant l'intensification.
function haloTexture() {
  const c = document.createElement('canvas')
  c.width = 64; c.height = 1
  const g = c.getContext('2d')
  const grad = g.createLinearGradient(0, 0, 64, 0)
  grad.addColorStop(0, 'rgba(255,255,255,0)')
  grad.addColorStop(0.5, 'rgba(255,255,255,1)')
  grad.addColorStop(1, 'rgba(255,255,255,0)')
  g.fillStyle = grad
  g.fillRect(0, 0, 64, 1)
  return new THREE.CanvasTexture(c)
}
const slitMat = new THREE.MeshBasicMaterial({ color: COLOR.accent, transparent: true })
const slit = new THREE.Mesh(new THREE.PlaneGeometry(3, 1), slitMat)
slit.position.z = 12
const haloMat = new THREE.MeshBasicMaterial({ color: COLOR.accent, map: haloTexture(), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
const halo = new THREE.Mesh(new THREE.PlaneGeometry(60, 1), haloMat)
halo.position.z = 12.5
scene.add(slit, halo)

function layout() {
  W = innerWidth
  H = innerHeight
  renderer.setSize(W, H)
  camera.aspect = W / H
  // Distance telle que le plan z = 0 corresponde au pixel près à l'écran.
  camera.position.set(0, 0, H / 2 / Math.tan(THREE.MathUtils.degToRad(FOV / 2)))
  camera.updateProjectionMatrix()
  buildLeaf(leaves.left, 'left', 'Grégoire')
  buildLeaf(leaves.right, 'right', 'Marchand')
  slit.scale.y = H * 1.2
  halo.scale.y = H * 1.2
  slitLight.position.set(0, 0, 30)
}

// --- Séquence commune aux 4 variantes --------------------------------------
const HOLD_MS = 900
const GLOW_MS = 600
const OPEN_MS = 1600
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)
let start = 0
let seeking = false
let state = { glow: 0, p: 0 }

function travel() { return W / 2 + BLEED + 80 }

function apply({ glow, p }) {
  state = { glow, p }
  const e = ease(p)
  leaves.left.position.x = -e * travel()
  leaves.right.position.x = e * travel()
  const fade = 1 - Math.min(1, p * 2)
  slitMat.opacity = (0.75 + 0.25 * glow) * fade
  slit.scale.x = 1 + 2 * glow
  haloMat.opacity = (0.25 + 0.75 * glow) * fade
  halo.scale.x = 0.4 + glow
  slitLight.intensity = 500 * glow * fade
}

function frame(now) {
  if (!seeking) {
    const t = now - start
    apply({
      glow: Math.min(1, Math.max(0, (t - HOLD_MS) / GLOW_MS)),
      p: Math.min(1, Math.max(0, (t - HOLD_MS - GLOW_MS) / OPEN_MS)),
    })
  }
  renderer.render(scene, camera)
}

function play() { seeking = false; start = performance.now() }

// --- Mesure : projections écran des objets ---------------------------------
const v = new THREE.Vector3()
function screenRect(points) {
  const r = { left: Infinity, right: -Infinity, top: Infinity, bottom: -Infinity }
  for (const p of points) {
    v.copy(p).project(camera)
    const x = (v.x + 1) / 2 * W
    const y = (1 - v.y) / 2 * H
    r.left = Math.min(r.left, x); r.right = Math.max(r.right, x)
    r.top = Math.min(r.top, y); r.bottom = Math.max(r.bottom, y)
  }
  return r
}
function boxCorners(box) {
  const out = []
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) out.push(new THREE.Vector3(x, y, z))
  return out
}
function measureLeaf(group) {
  group.updateMatrixWorld(true)
  const extent = screenRect(boxCorners(new THREE.Box3().setFromObject(group)))
  // Face avant de la tôle (z = 0) : c'est elle qui couvre l'écran.
  const slab = group.children[0]
  const b = new THREE.Box3().setFromObject(slab)
  const leaf = screenRect([new THREE.Vector3(b.min.x, b.min.y, 0), new THREE.Vector3(b.max.x, b.max.y, 0)])
  const word = group.getObjectByName('word')
  const { w, h } = word.userData.glyphs
  const corners = [[-w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2], [w / 2, -h / 2]].map(([x, y]) => word.localToWorld(new THREE.Vector3(x, y, 1)))
  return { leaf, extent, word: screenRect(corners) }
}

window.door = {
  replay: play,
  seek(p) { seeking = true; apply({ glow: p > 0 ? 1 : 0, p }); renderer.render(scene, camera) },
  get progress() { return state.p },
  measure() {
    return { viewport: { width: W, height: H }, progress: state.p, left: measureLeaf(leaves.left), right: measureLeaf(leaves.right) }
  },
}

document.getElementById('replay').addEventListener('click', play)
addEventListener('resize', () => { layout(); apply(state) })
document.fonts.ready.then(() => {
  layout()
  play()
  renderer.setAnimationLoop(frame)
})
</script>
</body>
</html>
