# Build Amplify du portfolio (TCK-304).
# Le mode WIP se pilote dans la console Amplify : variable NUXT_PUBLIC_WIP=true
# sur la branche main. La passer à false et relancer le build publie le site complet.
# La barre de qualité (lint, typecheck) tourne avant la génération : rouge, rien n'est publié.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run typecheck
        - NITRO_PRESET=static npm run generate
  artifacts:
    baseDirectory: .output/public
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
